name: Collect Nice departures

on:
  schedule:
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
      timezone: 'Europe/Paris'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: collect-nice-departures
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      FLIGHT_MAX_PAGES: '3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependencies
        run: python -m pip install 'psycopg[binary]>=3,<4' 'requests>=2,<3' 'python-dotenv>=1,<2'
      - name: Fetch flights and save to Neon
        run: python collect_flights.py
